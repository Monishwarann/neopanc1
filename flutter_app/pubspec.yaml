name: NEOPANC
description: "AI-Driven IoT Pancreatic Cancer Risk Screening Application"
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.32.0
  firebase_auth: ^4.19.6
  google_sign_in: ^6.2.1
  cloud_firestore: ^4.17.5
  firebase_storage: ^11.6.0
  cupertino_icons: ^1.0.5
  
  # HTTP API Networking
  http: ^1.1.0
  
  # State Management
  provider: ^6.0.5
  
  # Local caching
  shared_preferences: ^2.5.5
  
  # Rich Graphs and Telemetry charts
  fl_chart: ^0.65.0
  
  # Font & styling utilities
  google_fonts: ^6.1.0
  
  # PDF file sharing
  path_provider: ^2.1.1
  open_filex: ^4.5.0
  intl: ^0.20.3
  image_picker: ^1.2.2
  lottie: ^3.4.0
  pdf: ^3.13.0
  share_plus: ^10.0.0
  battery_plus: ^6.0.2

  # Wi-Fi & ESP32 connection manager packages
  connectivity_plus: ^6.0.3
  network_info_plus: ^6.0.0
  app_settings: ^6.1.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/6.jpeg"

flutter:
  uses-material-design: true
  
  # Add modern aesthetics assets if required
  assets:
    - assets/images/
